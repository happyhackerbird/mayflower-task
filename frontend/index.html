<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Poet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Address Poet Service</h1>

    <div class="container">
        <label for="address-input">Enter Address:</label>
        <input type="text" id="address-input" placeholder="Start typing an address...">
        <div id="suggestions-container"></div>
        <button id="submit-button">Get Poem</button>

        <div id="result-container">
            <h2>Result</h2>
            <div id="address-display"></div>
            <div id="poem-display"></div>
            <div id="error-display"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
