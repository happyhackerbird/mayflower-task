# .github/workflows/ci-cd.yml
name: Python CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  # Needed for pushing to GitHub Packages (ghcr.io)
  # packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"] # Match your project's Python version

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true # Match Dockerfile setup
        installer-parallel: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv # Cache the .venv directory
        # Define a cache key based on OS, Python version, and lock file hash
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies (including dev)
      # Run install only if cache doesn't hit
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test # Ensure tests pass before building/pushing
    # Only run this job on push events to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      # Needed for advanced build features like caching
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      # Use this action to log in to your container registry
      uses: docker/login-action@v3
      with:
        # Use secrets defined in your GitHub repository settings
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        # --- OR Uncomment below for GitHub Container Registry (ghcr.io) ---
        # registry: ghcr.io
        # username: ${{ github.actor }} # Your GitHub username
        # password: ${{ secrets.GITHUB_TOKEN }} # Use the default GITHUB_TOKEN

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: . # Use the current directory as build context
        push: true # Push the image after building
        # Define tags for the image
        # Replace DOCKERHUB_USERNAME with your actual username if using Docker Hub
        # Example for Docker Hub: your_username/mayflower-task:latest
        # Example for GHCR: ghcr.io/your_github_username/mayflower-task:latest
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mayflower-task:latest,${{ secrets.DOCKERHUB_USERNAME }}/mayflower-task:${{ github.sha }}
        # --- OR Use GHCR tags ---
        # tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest,ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
        # Leverage build cache for faster builds
        cache-from: type=gha
        cache-to: type=gha,mode=max
